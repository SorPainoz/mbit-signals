<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MicrobitSignals Remote</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 16px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    #status { font-size: 13px; color: #555; margin-bottom: 12px; }
    #stateLabel { font-size: 18px; font-weight: bold; margin-bottom: 16px; text-align: center; }
    button { padding: 10px 0; width: 100%; cursor: pointer; font-size: 14px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ccc; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #connectBtn { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    #btnOnCall { background: #d93025; color: #fff; border-color: #d93025; }
    #btnFree { background: #188038; color: #fff; border-color: #188038; }
  </style>
</head>
<body>
  <h2>Door Signal</h2>
  <div id="status">Disconnected</div>
  <div id="stateLabel">Unknown</div>
  <button id="connectBtn">Connect to micro:bit</button>
  <button id="btnOnCall" disabled>ON-CALL</button>
  <button id="btnFree" disabled>FREE</button>
  <script src="popup.js"></script>
</body>
</html>
